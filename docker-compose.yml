

services:
  postgres:
    image: postgres:15
    container_name: cliniq-postgres
    environment:
      POSTGRES_DB: cliniq
      POSTGRES_USER: cliniq
      POSTGRES_PASSWORD: cliniq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniq"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cliniq-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cliniq
      SPRING_DATASOURCE_USERNAME: cliniq
      SPRING_DATASOURCE_PASSWORD: cliniq
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
