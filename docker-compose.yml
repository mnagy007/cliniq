version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cliniq-postgres
    environment:
      POSTGRES_DB: cliniq
      POSTGRES_USER: cliniq
      POSTGRES_PASSWORD: cliniq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniq"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
