spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cliniq}
    username: ${SPRING_DATASOURCE_USERNAME:cliniq}
    password: ${SPRING_DATASOURCE_PASSWORD:cliniq}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

resilience4j:
  retry:
    instances:
      notificationRetry:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.lang.Exception
  circuitbreaker:
    instances:
      notificationCircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 100
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 10

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}

sendgrid:
  from-email: ${SENDGRID_FROM_EMAIL:noreply@cliniq.com}

openfda:
  base-url: ${OPENFDA_BASE_URL:https://api.fda.gov}

google:
  calendar:
    base-url: ${GOOGLE_CALENDAR_BASE_URL:https://www.googleapis.com}
    client-id: ${GOOGLE_OAUTH2_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH2_CLIENT_SECRET:}

cliniq:
  encryption:
    key: ${CLINIQ_ENCRYPTION_KEY:}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:5000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}