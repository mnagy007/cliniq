version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cliniq-postgres
    environment:
      POSTGRES_DB: cliniq
      POSTGRES_USER: cliniq
      POSTGRES_PASSWORD: cliniq
    ports:
      - "5432:5432"
    volumes:
      - cliniq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniq -d cliniq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cliniq-pgdata:
